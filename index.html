<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeekPeak – Your Weekend Scout</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #1a0a10; color: #fff; min-height: 100vh; }

    header {
      background: #5C1A2E;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header img { height: 36px; }
    .settings-btn {
      background: none;
      border: none;
      color: #FFD580;
      font-size: 22px;
      cursor: pointer;
      width: auto;
      padding: 0;
    }

    #auth-container {
      max-width: 420px;
      margin: 40px auto;
      padding: 32px;
      background: #2a0f1a;
      border-radius: 16px;
      border: 1px solid #7B2D42;
    }
    .auth-logo {
      display: block;
      margin: 0 auto 28px auto;
      height: 60px;
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #7B2D42;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      background: #1a0a10;
      color: #aaa;
      font-size: 14px;
      font-weight: 600;
      border: none;
      width: auto;
    }
    .auth-tab.active {
      background: #7B2D42;
      color: #fff;
    }
    label {
      display: block;
      color: #EDD0D9;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .note {
      color: #aaa;
      font-size: 11px;
      margin-top: -10px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #7B2D42;
      background: #1a0a10;
      color: #fff;
      font-size: 15px;
    }
    input::placeholder { color: #aaa; }
    button {
      width: 100%;
      padding: 14px;
      background: #7B2D42;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #9a3a55; }
    .forgot-link {
      text-align: center;
      margin-top: 12px;
      color: #EDD0D9;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      display: block;
    }
    .error-msg {
      color: #ff6b6b;
      font-size: 13px;
      margin-bottom: 12px;
      text-align: center;
    }

    #map {
      height: 220px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #7B2D42;
    }
    .map-note {
      color: #aaa;
      font-size: 11px;
      margin-bottom: 16px;
    }

    #app-container { display: none; padding: 24px; max-width: 800px; margin: 0 auto; }
    #app-container h2 { color: #FFD580; margin-bottom: 20px; }

    #settings-panel {
      display: none;
      max-width: 420px;
      margin: 40px auto;
      padding: 32px;
      background: #2a0f1a;
      border-radius: 16px;
      border: 1px solid #7B2D42;
    }
    #settings-panel h2 { color: #FFD580; margin-bottom: 24px; text-align: center; }

    .flight-card {
      background: #F5E6EB;
      color: #1a0a10;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .flight-card .city { font-size: 20px; font-weight: 700; }
    .flight-card .date { color: #5C1A2E; margin: 4px 0; }
    .flight-card .price { color: #7B2D42; font-size: 22px; font-weight: 700; }
    .flight-card .price.cheapest { color: #2d7a3a; }
    .badge {
      display: inline-block;
      background: #EDD0D9;
      color: #5C1A2E;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .book-btn {
      width: auto;
      padding: 10px 20px;
      margin-top: 12px;
      font-size: 14px;
    }
    #loading { text-align: center; padding: 40px; color: #FFD580; display: none; }
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="WeekPeak" />
  <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
</header>

<!-- Auth Screen -->
<div id="auth-container">
  <img src="logo.png" alt="WeekPeak" class="auth-logo" />
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Login</button>
    <button class="auth-tab" onclick="switchTab('register')">Register</button>
  </div>
  <div id="error-msg" class="error-msg"></div>

  <!-- Login -->
  <div id="login-form">
    <label>Email</label>
    <input type="email" id="login-email" placeholder="your@email.com" />
    <label>Password</label>
    <input type="password" id="login-password" placeholder="Your password" />
    <button onclick="loginUser()">Login</button>
    <span class="forgot-link" onclick="resetPassword()">Forgot password?</span>
  </div>

  <!-- Register -->
  <div id="register-form" style="display:none;">
    <label>Full Name</label>
    <input type="text" id="reg-name" placeholder="Your name" />
    <label>Email</label>
    <input type="email" id="reg-email" placeholder="your@email.com" />
    <label>Telegram Username</label>
    <input type="text" id="reg-telegram" placeholder="@username" />
    <p class="note">How to find it: open Telegram → Settings → tap your name → copy the username starting with @</p>
    <label>Password</label>
    <input type="password" id="reg-password" placeholder="Choose a password (min 6 characters)" />
    <label>Your Location</label>
    <input type="text" id="city-search" placeholder="Type your city name..." oninput="searchCity(this.value)" />
    <div id="map"></div>
    <p class="map-note">📍 Type your city or click on the map to pin your location</p>
    <button onclick="registerUser()">Create Account</button>
  </div>
</div>

<!-- Main App -->
<div id="app-container">
  <h2>🏖️ Weekend Flight Deals</h2>
  <div id="loading">⏳ Searching for the best deals...</div>
  <div id="flights-list"></div>
</div>

<!-- Settings -->
<div id="settings-panel">
  <h2>⚙️ Settings</h2>
  <label>Update Your Location</label>
  <input type="text" id="settings-city-search" placeholder="Type your city name..." oninput="searchSettingsCity(this.value)" />
  <div id="settings-map" style="height:220px; border-radius:8px; margin-bottom:8px; border:1px solid #7B2D42;"></div>
  <p class="map-note">📍 Type your city or click on the map</p>
  <button onclick="saveSettings()">Save Changes</button>
  <button onclick="logout()" style="background:#3a1525; margin-top:10px;">Logout</button>
  <button onclick="closeSettings()" style="background:#2a0f1a; margin-top:10px; border:1px solid #7B2D42;">Cancel</button>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7OWGLVQXUJ8UdPhQyTPNucRwaDAG2gbc",
    authDomain: "weekpeak-31325.firebaseapp.com",
    projectId: "weekpeak-31325",
    storageBucket: "weekpeak-31325.firebasestorage.app",
    messagingSenderId: "482132243768",
    appId: "1:482132243768:web:8690946e33b4fb1b267dcd"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.registerUser = async function() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const telegram = document.getElementById('reg-telegram').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    const errEl = document.getElementById('error-msg');

    if (!name || !email || !password) { errEl.textContent = 'Please fill in all fields'; return; }
    if (!window.userLat || !window.userLng) { errEl.textContent = 'Please set your location on the map'; return; }

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, telegram,
        lat: window.userLat,
        lng: window.userLng
      });
      showApp();
    } catch (e) {
      errEl.textContent = e.message;
    }
  }

  window.loginUser = async function() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const errEl = document.getElementById('error-msg');
    try {
      await signInWithEmailAndPassword(auth, email, password);
      showApp();
    } catch (e) {
      errEl.textContent = 'Incorrect email or password';
    }
  }

  window.resetPassword = async function() {
    const email = document.getElementById('login-email').value.trim();
    if (!email) { document.getElementById('error-msg').textContent = 'Enter your email first'; return; }
    await sendPasswordResetEmail(auth, email);
    document.getElementById('error-msg').style.color = '#FFD580';
    document.getElementById('error-msg').textContent = 'Password reset email sent!';
  }

  window.logout = async function() {
    await signOut(auth);
    document.getElementById('settings-panel').style.display = 'none';
    document.getElementById('auth-container').style.display = 'block';
    switchTab('login');
  }

  window.saveSettings = async function() {
    if (!window.settingsLat || !window.settingsLng) { alert('Please set your location'); return; }
    const user = auth.currentUser;
    if (user) {
      await setDoc(doc(db, 'users', user.uid), { lat: window.settingsLat, lng: window.settingsLng }, { merge: true });
    }
    closeSettings();
  }

  onAuthStateChanged(auth, (user) => {
    if (user) showApp();
  });

  function showApp() {
    document.getElementById('auth-container').style.display = 'none';
    document.getElementById('app-container').style.display = 'block';
  }
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  window.userLat = null;
  window.userLng = null;
  let marker = null;

  const map = L.map('map').setView([48.8566, 2.3522], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  map.on('click', function(e) {
    window.userLat = e.latlng.lat;
    window.userLng = e.latlng.lng;
    if (marker) marker.remove();
    marker = L.marker([window.userLat, window.userLng]).addTo(map);
  });

  let searchTimeout;
  function searchCity(query) {
    clearTimeout(searchTimeout);
    if (query.length < 3) return;
    searchTimeout = setTimeout(async () => {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
      const data = await res.json();
      if (data.length > 0) {
        window.userLat = parseFloat(data[0].lat);
        window.userLng = parseFloat(data[0].lon);
        map.setView([window.userLat, window.userLng], 10);
        if (marker) marker.remove();
        marker = L.marker([window.userLat, window.userLng]).addTo(map);
      }
    }, 600);
  }

  window.settingsLat = null;
  window.settingsLng = null;
  let settingsMap = null, settingsMarker = null;

  window.openSettings = function() {
    document.getElementById('app-container').style.display = 'none';
    document.getElementById('settings-panel').style.display = 'block';
    setTimeout(() => {
      if (!settingsMap) {
        settingsMap = L.map('settings-map').setView([48.8566, 2.3522], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(settingsMap);
        settingsMap.on('click', function(e) {
          window.settingsLat = e.latlng.lat;
          window.settingsLng = e.latlng.lng;
          if (settingsMarker) settingsMarker.remove();
          settingsMarker = L.marker([window.settingsLat, window.settingsLng]).addTo(settingsMap);
        });
      }
    }, 100);
  }

  function searchSettingsCity(query) {
    clearTimeout(searchTimeout);
    if (query.length < 3) return;
    searchTimeout = setTimeout(async () => {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
      const data = await res.json();
      if (data.length > 0) {
        window.settingsLat = parseFloat(data[0].lat);
        window.settingsLng = parseFloat(data[0].lon);
        settingsMap.setView([window.settingsLat, window.settingsLng], 10);
        if (settingsMarker) settingsMarker.remove();
        settingsMarker = L.marker([window.settingsLat, window.settingsLng]).addTo(settingsMap);
      }
    }, 600);
  }

  window.closeSettings = function() {
    document.getElementById('settings-panel').style.display = 'none';
    document.getElementById('app-container').style.display = 'block';
  }

  window.switchTab = function(tab) {
    document.getElementById('error-msg').textContent = '';
    if (tab === 'login') {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('register-form').style.display = 'none';
      document.querySelectorAll('.auth-tab')[0].classList.add('active');
      document.querySelectorAll('.auth-tab')[1].classList.remove('active');
    } else {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
      document.querySelectorAll('.auth-tab')[0].classList.remove('active');
      document.querySelectorAll('.auth-tab')[1].classList.add('active');
    }
  }
</script>

</body>
</html>
