<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeekPeak – Your Weekend Scout</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #1a0a10; color: #fff; min-height: 100vh; }

    header {
      background: #5C1A2E;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header img { height: 36px; }
    .settings-btn {
      background: none;
      border: none;
      color: #FFD580;
      font-size: 22px;
      cursor: pointer;
      width: auto;
      padding: 0;
    }

    #auth-container {
      max-width: 420px;
      margin: 40px auto;
      padding: 32px;
      background: #2a0f1a;
      border-radius: 16px;
      border: 1px solid #7B2D42;
    }
    .auth-logo {
      display: block;
      margin: 0 auto 28px auto;
      height: 60px;
    }
    label {
      display: block;
      color: #EDD0D9;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .note {
      color: #aaa;
      font-size: 11px;
      margin-top: -10px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #7B2D42;
      background: #1a0a10;
      color: #fff;
      font-size: 15px;
    }
    input::placeholder { color: #aaa; }
    button {
      width: 100%;
      padding: 14px;
      background: #7B2D42;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #9a3a55; }

    #map {
      height: 220px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #7B2D42;
    }
    .map-note {
      color: #aaa;
      font-size: 11px;
      margin-bottom: 16px;
    }

    #app-container { display: none; padding: 24px; max-width: 800px; margin: 0 auto; }
    #app-container h2 { color: #FFD580; margin-bottom: 20px; }

    #settings-panel {
      display: none;
      max-width: 420px;
      margin: 40px auto;
      padding: 32px;
      background: #2a0f1a;
      border-radius: 16px;
      border: 1px solid #7B2D42;
    }
    #settings-panel h2 { color: #FFD580; margin-bottom: 24px; text-align: center; }

    .flight-card {
      background: #F5E6EB;
      color: #1a0a10;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .flight-card .city { font-size: 20px; font-weight: 700; }
    .flight-card .date { color: #5C1A2E; margin: 4px 0; }
    .flight-card .price { color: #7B2D42; font-size: 22px; font-weight: 700; }
    .flight-card .price.cheapest { color: #2d7a3a; }
    .badge {
      display: inline-block;
      background: #EDD0D9;
      color: #5C1A2E;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .book-btn {
      width: auto;
      padding: 10px 20px;
      margin-top: 12px;
      font-size: 14px;
    }

    #loading { text-align: center; padding: 40px; color: #FFD580; display: none; }
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="WeekPeak" />
  <button class="settings-btn" onclick="openSettings()" title="Settings">⚙️</button>
</header>

<!-- Registration Screen -->
<div id="auth-container">
  <img src="logo.png" alt="WeekPeak" class="auth-logo" />

  <label>Full Name</label>
  <input type="text" id="name" placeholder="Your name" />

  <label>Email</label>
  <input type="email" id="email" placeholder="your@email.com" />

  <label>Telegram Username</label>
  <input type="text" id="telegram" placeholder="@username" />
  <p class="note">How to find your username: open Telegram → Settings → tap your name → copy the username that starts with @</p>

  <label>Password</label>
  <input type="password" id="password" placeholder="Choose a password" />

  <label>Your Location</label>
  <input type="text" id="city-search" placeholder="Type your city name..." oninput="searchCity(this.value)" />
  <div id="map"></div>
  <p class="map-note">📍 Type your city above or click on the map to pin your location</p>

  <button onclick="handleAuth()">Get Started</button>
</div>

<!-- Main App Screen -->
<div id="app-container">
  <h2>🏖️ Weekend Flight Deals</h2>
  <div id="loading">⏳ Searching for the best deals...</div>
  <div id="flights-list"></div>
</div>

<!-- Settings Panel -->
<div id="settings-panel">
  <h2>⚙️ Settings</h2>
  <label>Update Your Location</label>
  <input type="text" id="settings-city-search" placeholder="Type your city name..." oninput="searchSettingsCity(this.value)" />
  <div id="settings-map" style="height:220px; border-radius:8px; margin-bottom:8px; border:1px solid #7B2D42;"></div>
  <p class="map-note">📍 Type your city or click on the map</p>
  <button onclick="saveSettings()">Save Changes</button>
  <button onclick="logout()" style="background:#3a1525; margin-top:10px;">Logout</button>
  <button onclick="closeSettings()" style="background:#2a0f1a; margin-top:10px; border: 1px solid #7B2D42;">Cancel</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([48.8566, 2.3522], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  let userLat = null, userLng = null, marker = null;

  map.on('click', function(e) {
    userLat = e.latlng.lat;
    userLng = e.latlng.lng;
    if (marker) marker.remove();
    marker = L.marker([userLat, userLng]).addTo(map);
  });

  let searchTimeout;
  function searchCity(query) {
    clearTimeout(searchTimeout);
    if (query.length < 3) return;
    searchTimeout = setTimeout(async () => {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
      const data = await res.json();
      if (data.length > 0) {
        userLat = parseFloat(data[0].lat);
        userLng = parseFloat(data[0].lon);
        map.setView([userLat, userLng], 10);
        if (marker) marker.remove();
        marker = L.marker([userLat, userLng]).addTo(map);
      }
    }, 600);
  }

  let settingsMap = null, settingsMarker = null, settingsLat = null, settingsLng = null;

  function openSettings() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    document.getElementById('app-container').style.display = 'none';
    document.getElementById('settings-panel').style.display = 'block';
    setTimeout(() => {
      if (!settingsMap) {
        settingsMap = L.map('settings-map').setView([user.lat || 48.8566, user.lng || 2.3522], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(settingsMap);
        settingsMap.on('click', function(e) {
          settingsLat = e.latlng.lat;
          settingsLng = e.latlng.lng;
          if (settingsMarker) settingsMarker.remove();
          settingsMarker = L.marker([settingsLat, settingsLng]).addTo(settingsMap);
        });
        if (user.lat) {
          settingsMarker = L.marker([user.lat, user.lng]).addTo(settingsMap);
        }
      }
    }, 100);
  }

  function searchSettingsCity(query) {
    clearTimeout(searchTimeout);
    if (query.length < 3) return;
    searchTimeout = setTimeout(async () => {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
      const data = await res.json();
      if (data.length > 0) {
        settingsLat = parseFloat(data[0].lat);
        settingsLng = parseFloat(data[0].lon);
        settingsMap.setView([settingsLat, settingsLng], 10);
        if (settingsMarker) settingsMarker.remove();
        settingsMarker = L.marker([settingsLat, settingsLng]).addTo(settingsMap);
      }
    }, 600);
  }

  function saveSettings() {
    if (!settingsLat || !settingsLng) { alert('Please set your location'); return; }
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    user.lat = settingsLat;
    user.lng = settingsLng;
    localStorage.setItem('user', JSON.stringify(user));
    closeSettings();
  }

  function closeSettings() {
    document.getElementById('settings-panel').style.display = 'none';
    document.getElementById('app-container').style.display = 'block';
  }

  function logout() {
    const password = prompt('Enter your password to logout:');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (password === user.password) {
      localStorage.removeItem('user');
      location.reload();
    } else {
      alert('Incorrect password');
    }
  }

  function handleAuth() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!name || !email || !password) { alert('Please fill in all required fields'); return; }
    if (!userLat || !userLng) { alert('Please set your location on the map'); return; }
    localStorage.setItem('user', JSON.stringify({ name, email, lat: userLat, lng: userLng, password }));
    document.getElementById('auth-container').style.display = 'none';
    document.getElementById('app-container').style.display = 'block';
  }

  window.onload = function() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.name && user.lat) {
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
    }
  }
</script>

</body>
</html>
